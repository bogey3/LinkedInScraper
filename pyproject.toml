[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-scraper"
version = "0.1.0"
description = "List a company's employees from LinkedIn and generate email addresses from a name template"
readme = "readme.md"
requires-python = ">=3.9"
# kept in requirements.txt so `pip install -r requirements.txt` and the package can't drift apart
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/bogey3/LinkedInScraper"

[project.scripts]
linkedin-scraper = "linkedin:main"
linkedin-names = "names:main"

[tool.setuptools]
py-modules = ["linkedin", "names"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
